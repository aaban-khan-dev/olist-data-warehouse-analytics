[uwsgi]
chdir           = /home/ubuntu/olist_dashboard
module          = config.wsgi:application
home            = /home/ubuntu/olist_dashboard/venv

master          = true
processes       = 2
threads         = 2

socket          = /run/olist/olist.sock
chmod-socket    = 660
vacuum          = true
die-on-term     = true

harakiri        = 30
max-requests    = 1000
buffer-size     = 16384
